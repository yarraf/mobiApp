name: Build Android APK & AAB

on:
  push:
    branches: [android-dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Install Expo CLI
        run: npm install -g expo-cli

      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_BASE64 }}" | base64 --decode > google-services.json

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/smakidnia.keystore

      - name: Build APK + AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease

      - name: List APK files
        run: ls -la android/app/build/outputs/apk/release/

      - name: Sign APK
        run: |
          BUILD_TOOLS=$(ls $ANDROID_SDK_ROOT/build-tools/ | sort -V | tail -1)
          APK_FILE=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "Signing: $APK_FILE"
          $ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner sign \
            --ks android/app/smakidnia.keystore \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --out android/app/build/outputs/apk/release/smakidnia-signed.apk \
            $APK_FILE

      - name: Sign AAB
        run: |
          jarsigner -verbose \
            -keystore android/app/smakidnia.keystore \
            -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
            -keypass ${{ secrets.KEY_PASSWORD }} \
            -signedjar android/app/build/outputs/bundle/release/smakidnia-signed.aab \
            android/app/build/outputs/bundle/release/app-release.aab \
            ${{ secrets.KEY_ALIAS }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smakidnia-release-apk
          path: android/app/build/outputs/apk/release/smakidnia-signed.apk
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: smakidnia-release-aab
          path: android/app/build/outputs/bundle/release/smakidnia-signed.aab
          retention-days: 30
